name: Validate setup

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/apply scripts/bootstrap-robot scripts/install-deployment-revision scripts/run-service
      - run: python3 -m py_compile scripts/render-deployment.py
